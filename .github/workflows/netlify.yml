name: netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Write Next public env
        run: |
          cat > .env.production <<EOF
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID=${{ secrets.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}
          NEXT_PUBLIC_WQIE=${{ secrets.NEXT_PUBLIC_WQIE }}
          NEXT_PUBLIC_LAUNCHPAD_FACTORY=${{ secrets.NEXT_PUBLIC_LAUNCHPAD_FACTORY }}
          NEXT_PUBLIC_AMM_FACTORY=${{ secrets.NEXT_PUBLIC_AMM_FACTORY }}
          NEXT_PUBLIC_AMM_ROUTER=${{ secrets.NEXT_PUBLIC_AMM_ROUTER }}
          NEXT_PUBLIC_FEE_ROUTER=${{ secrets.NEXT_PUBLIC_FEE_ROUTER }}
          NEXT_PUBLIC_QIE_USD_ORACLE=${{ secrets.NEXT_PUBLIC_QIE_USD_ORACLE }}
          NEXT_PUBLIC_LENDING_POOL=${{ secrets.NEXT_PUBLIC_LENDING_POOL }}
          NEXT_PUBLIC_BATCH_SENDER=${{ secrets.NEXT_PUBLIC_BATCH_SENDER }}
          NEXT_PUBLIC_MONEY_MARKET=${{ secrets.NEXT_PUBLIC_MONEY_MARKET }}
          NEXT_PUBLIC_ELSE_TOKEN=${{ secrets.NEXT_PUBLIC_ELSE_TOKEN }}
          NEXT_PUBLIC_DCA=${{ secrets.NEXT_PUBLIC_DCA }}
          EOF
      - run: npm ci
      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}
          NEXT_PUBLIC_WQIE: ${{ secrets.NEXT_PUBLIC_WQIE }}
          NEXT_PUBLIC_LAUNCHPAD_FACTORY: ${{ secrets.NEXT_PUBLIC_LAUNCHPAD_FACTORY }}
          NEXT_PUBLIC_AMM_FACTORY: ${{ secrets.NEXT_PUBLIC_AMM_FACTORY }}
          NEXT_PUBLIC_AMM_ROUTER: ${{ secrets.NEXT_PUBLIC_AMM_ROUTER }}
          NEXT_PUBLIC_FEE_ROUTER: ${{ secrets.NEXT_PUBLIC_FEE_ROUTER }}
          NEXT_PUBLIC_QIE_USD_ORACLE: ${{ secrets.NEXT_PUBLIC_QIE_USD_ORACLE }}
          NEXT_PUBLIC_LENDING_POOL: ${{ secrets.NEXT_PUBLIC_LENDING_POOL }}
          NEXT_PUBLIC_BATCH_SENDER: ${{ secrets.NEXT_PUBLIC_BATCH_SENDER }}
          NEXT_PUBLIC_MONEY_MARKET: ${{ secrets.NEXT_PUBLIC_MONEY_MARKET }}
          NEXT_PUBLIC_ELSE_TOKEN: ${{ secrets.NEXT_PUBLIC_ELSE_TOKEN }}
          NEXT_PUBLIC_DCA: ${{ secrets.NEXT_PUBLIC_DCA }}
        # Pinned: this job holds NETLIFY_AUTH_TOKEN/NETLIFY_SITE_ID in its
        # env, and an unpinned `npx --yes netlify-cli` would fetch whatever
        # version (and full transitive dependency tree) npm serves at deploy
        # time and execute it with those secrets live on every push to main.
        run: npx --yes netlify-cli@27.4.0 deploy --build --prod --message "gha ${GITHUB_SHA}"
