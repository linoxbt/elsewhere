name: netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Write Next public env
        run: |
          cat > .env.production <<EOF
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID=${{ secrets.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}
          NEXT_PUBLIC_WQIE=${{ secrets.NEXT_PUBLIC_WQIE }}
          NEXT_PUBLIC_LAUNCHPAD_FACTORY=${{ secrets.NEXT_PUBLIC_LAUNCHPAD_FACTORY }}
          NEXT_PUBLIC_AMM_FACTORY=${{ secrets.NEXT_PUBLIC_AMM_FACTORY }}
          NEXT_PUBLIC_AMM_ROUTER=${{ secrets.NEXT_PUBLIC_AMM_ROUTER }}
          NEXT_PUBLIC_FEE_ROUTER=${{ secrets.NEXT_PUBLIC_FEE_ROUTER }}
          NEXT_PUBLIC_QIE_USD_ORACLE=${{ secrets.NEXT_PUBLIC_QIE_USD_ORACLE }}
          EOF
      - run: npm ci
      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}
          NEXT_PUBLIC_WQIE: ${{ secrets.NEXT_PUBLIC_WQIE }}
          NEXT_PUBLIC_LAUNCHPAD_FACTORY: ${{ secrets.NEXT_PUBLIC_LAUNCHPAD_FACTORY }}
          NEXT_PUBLIC_AMM_FACTORY: ${{ secrets.NEXT_PUBLIC_AMM_FACTORY }}
          NEXT_PUBLIC_AMM_ROUTER: ${{ secrets.NEXT_PUBLIC_AMM_ROUTER }}
          NEXT_PUBLIC_FEE_ROUTER: ${{ secrets.NEXT_PUBLIC_FEE_ROUTER }}
          NEXT_PUBLIC_QIE_USD_ORACLE: ${{ secrets.NEXT_PUBLIC_QIE_USD_ORACLE }}
        run: npx --yes netlify-cli deploy --build --prod --message "gha ${GITHUB_SHA}"
